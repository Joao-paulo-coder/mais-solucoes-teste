<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--Mais solucoes-chamado--</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Secular+One&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./src/css/reset.css">

    <link rel="stylesheet" href="./src/css/estilos.css">

    <link rel="stylesheet" href="./src/css/responsivo.css">

    <script src="./src/js/index.js" defer></script>
</head>

<body>
    <main class="servicos">
        <div class="servico selecionado">
            <picture>
                <source srcset="./src/imagens/1.0-mais.solucoes.desktop.png" media="(min-width: 768px)">
                <img class="imagem" src="./src/imagens/1.1-mais.solucoes.mobile.png" alt="Empresa +soluçoes">
            </picture>
            <div class="conteudo">
                <h2 class="nome-servico">MAIS SOLUÇÕES</h2>
                <p class="descricao">Bem vindo(a) faça seu chamado e voce sera atendido(a) em instantes </p>
            </div>
        </div>
        <div class="servico">
            <picture>
                <source srcset="./src/imagens/2.0.telefonia.desktop.png" media="(min-width: 768px)" />
                <img class="imagem" src="./src/imagens/2.1.telefonia.mobile.png" alt="Serviço telefonia" />
            </picture>
            <div class="conteudo">
                <h2 class="nome-servico">Telefonia</h2>
                <p class="descricao">teste</p>
            </div>
        </div>

        <div class="servico">
            <picture>
                <source srcset="./src/imagens/3.0.refrigeracao.png" media="(min-width: 768px)" />
                <img class="imagem" src="./src/imagens/3.1.refrigeracao.mobile.png" alt="Refrigeraçao" />
            </picture>
            <div class="conteudo">
                <h2 class="nome-servico">Refrigeraçao</h2>
                <p class="descricao">teste.</p>
            </div>
        </div>
        <div class="servico">
            <picture>
                <source srcset="./src/imagens/4.0.informatica.desktop.png" media="(min-width: 768px)" />
                <img class="imagem" src="./src/imagens/4.1.informatica.mobile.png" alt="informatica" />
            </picture>
            <div class="conteudo">
                <h2 class="nome-servico">Informatica</h2>
                <p class="descricao">teste.</p>
            </div>
        </div>

    </main>
    <ul class="botoes">
        <li>
            <button class="botao empresa selecionado">
                <img src="./src/imagens/1.2.empresa-botao.png" alt="Ícone empresa">
            </button>
        </li>
        <li>
            <button class="botao telefonia">
                <img src="./src/imagens/2.2.telefonia.botao.png" alt="Ícone telefonia" />
            </button>
        </li>
        <li>
            <button class="botao refrigeracao">
                <img src="./src/imagens/3.2.refrigeracao-botao.png" alt="Ícone refrigeracao" />
            </button>
        </li>
        <li>
            <button class="botao informatica">
                <img src="./src/imagens/4.2.informatica.botao.png" alt="Ícone informatica" />
            </button>
        </li>
        <li>
            <button class = "botao abrirServico"id="abrirServico">ABRIR CHAMADO</button>

        </li>  
        
    </ul>

        <script src="./src/js/index.js"></script>   

<script>
    document.getElementById("abrirServico").addEventListener("click", function() {
        window.location.href = "https://jsoluocoes.milldesk.com";
    });
</script>

</body>

</html>
